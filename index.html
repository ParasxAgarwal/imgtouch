    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              'dancing': ['"Dancing Script"', 'cursive'],
              'great-vibes': ['"Great Vibes"', 'cursive'],
              'pacifico': ['Pacifico', 'cursive'],

              'parisienne': ['Parisienne', 'cursive'],
              'allura': ['Allura', 'cursive'],
              'pinyon': ['"Pinyon Script"', 'cursive'],
              'playball': ['Playball', 'cursive'],
              'abril': ['"Abril Fatface"', 'cursive'],
              'bebas': ['"Bebas Neue"', 'sans-serif'],
              'cinzel': ['Cinzel', 'serif'],
              'cinzel-dec': ['"Cinzel Decorative"', 'serif'],
              'orbitron': ['Orbitron', 'sans-serif'],
              'ruslan': ['"Ruslan Display"', 'cursive'],
              'rye': ['Rye', 'serif'],
              'metal': ['"Metal Mania"', 'cursive'],
              'gothic': ['"UnifrakturMaguntia"', 'cursive'],
              'creepster': ['Creepster', 'cursive'],
              'monsieur': ['"Monsieur La Doulaise"', 'cursive'],

            colors: {
              'g-blue': '#1a73e8',
              'g-blue-light': '#8ab4f8',
              'g-red': '#ea4335',
              'g-yellow': '#fbbc04',
              'g-green': '#34a853',

              'g-bg': '#f8f9fa',

              'g-border': '#dadce0',

              'g-dark-text': '#f2f3f5',
            }
          }
        }
      }

    <style>
      /* Custom Scrollbar for a sleeker look */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f3f4; 
      }
      .dark ::-webkit-scrollbar-track {
        background: #202124; 
      }
      ::-webkit-scrollbar-thumb {
        background: #dadce0; 
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #3c4043; 
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #bdc1c6; 
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #5f6368; 
      }
      .canvas-pattern {
        background-color: #f8f9fa;
        background-image: radial-gradient(#dadce0 1px, transparent 1px);
        background-size: 20px 20px;
      }
      .dark .canvas-pattern {
        background-color: #171717;
        background-image: radial-gradient(#333333 1px, transparent 1px);
        background-size: 20px 20px;
      }
      /* Advanced Typography */
      .pro-text-render {
        paint-order: stroke fill;
        -webkit-font-smoothing: antialiased;
      }
    </style>
